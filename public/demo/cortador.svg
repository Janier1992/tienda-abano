<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Cortador de doble hoja metálico">
  <defs>
    <radialGradient id="cortador-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2b2721"/><stop offset="0.55" stop-color="#17110d"/><stop offset="1" stop-color="#0c0907"/>
    </radialGradient>
    <linearGradient id="cortador-cedar" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#b9774a"/><stop offset="0.5" stop-color="#8e5532"/><stop offset="1" stop-color="#5e3520"/>
    </linearGradient>
    <linearGradient id="cortador-leaf" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9a6238"/><stop offset="0.45" stop-color="#6e3f22"/><stop offset="1" stop-color="#3f2213"/>
    </linearGradient>
    <linearGradient id="cortador-gold" x1="0" x2="1">
      <stop offset="0" stop-color="#8f6a32"/><stop offset="0.35" stop-color="#f1d79b"/><stop offset="0.6" stop-color="#c9a160"/><stop offset="1" stop-color="#7d5a28"/>
    </linearGradient>
    <linearGradient id="cortador-metal" x1="0" x2="1">
      <stop offset="0" stop-color="#5b544c"/><stop offset="0.3" stop-color="#e9e1d3"/><stop offset="0.55" stop-color="#a9a093"/><stop offset="1" stop-color="#4a443d"/>
    </linearGradient>
    <filter id="cortador-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="cortador-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="cortador-soft"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#cortador-bg)"/>
  <circle cx="400" cy="360" r="260" fill="#e2b979" opacity="0.13" filter="url(#cortador-glow)"/>

    <ellipse cx="400" cy="800" rx="230" ry="32" fill="#000" opacity="0.6" filter="url(#cortador-shadow)"/>
    <g transform="rotate(-14 400 500)" filter="url(#cortador-soft)">
      <rect x="150" y="390" width="500" height="220" rx="110" fill="url(#cortador-metal)"/>
      <rect x="150" y="390" width="500" height="60" rx="30" fill="#fff" opacity="0.22"/>
      <circle cx="400" cy="500" r="72" fill="#120d0a"/>
      <circle cx="400" cy="500" r="72" fill="none" stroke="url(#cortador-gold)" stroke-width="6"/>
      <circle cx="225" cy="500" r="40" fill="#120d0a" opacity="0.85"/>
      <circle cx="575" cy="500" r="40" fill="#120d0a" opacity="0.85"/>
      <path d="M180 500 H620" stroke="#2b2520" stroke-opacity="0.5" stroke-width="2"/>
    </g></svg>
